<!DOCTYPE html>
<html>
    <head>
        <title>Exemplo de Formulários</title>
    </head>
    <body>
        <h1>Formulário de Cadastro</h1>
        <form action="/enviar_dados" method="get">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome required"><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="email">Senha:</label>
            <input type="password" id="senha" name="senha" required><br><br>


            <label for="pais">Gênero:</label>
            <select id="pais" nome="pais">
                <option value="brasil">Masculino</option>
                <option value="eua">Feminino</option>
            </select><br><br>


            <label for="mensagem">Biografia:</label><br>
            <textarea id="mensagem" name="mensagem" rows=4 cols="30"></textarea><br><br>

            <input type="submit" id="send" value="Enviar">
            <input type="reset" id="clean" value="Limpar">
        </form>
    </body>
</html>
