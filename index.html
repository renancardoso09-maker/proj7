<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro de Usuário</title>
    </head>
    <body>

        <header>
            <h1>Cadastro de Usuário</h1>

            <nav>
                <ul>
                    <li><a href="#">Página Principal</a></li>
                    <li><a href="#">Sobre Nós</a></li>
                    <li><a href="#">Meu Perfil</a></li>
                </ul>
            </nav>
        </header>
        <section>
            <h2>Formulário de Cadastro</h2>

            <form action="/enviar_dados" method="post">

                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>


                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>


                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha" required><br><br>

                <label for="genero">Gênero:</label><br>
                <select id="genero" name="genero" required>
                    <option value="">Selecione...</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                </select><br><br>

                <label>Interesses:</label><br>
                <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
                <label for="tecnologia">Tecnologia</label><br>

                <input type="checkbox" id="programacao" name="interesses" value="programacao">
                <label for="programacao">Programação</label><br>

                <input type="checkbox" id="design" name="interesses" value="design">
                <label for="design">Design</label><br>

                <input type="checkbox" id="musica" name="interesses" value="musica">
                <label for="musica">Música</label><br><br>

                <label for="mensagem">Biografia:</label><br>
                <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea><br><br>

     
                <input type="submit" id="send" value="Enviar">
                <input type="reset" id="clean" value="Limpar">
            </form>
        </section>
    </body>
</html>
